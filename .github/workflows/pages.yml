name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/wonderful-sagan-xz142y]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp build id for cache busting
        run: sed -i "s/window.BUILD = \"1\"/window.BUILD = \"${GITHUB_SHA::8}\"/" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
